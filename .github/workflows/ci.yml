name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'schedule'
    name: Full validation (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input ".[test]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test clean core
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Self-check
        env:
          PYTHONPATH: src
        run: python -m kubo self-check
      - name: Example end-to-end analysis
        run: |
          example_root=$(mktemp -d)
          kubo-core analyze-local \
            --bundle examples/local_bundle \
            --output "$example_root/result" \
            > "$example_root/stdout.json"
          python -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["status"] == "PASS_RESEARCH_SUMMARY"; assert report["claim_boundaries"]["recommendation"] is False' "$example_root/stdout.json"

  compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Compatibility smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime package only
        run: python -m pip install --disable-pip-version-check --no-input --no-deps .
      - name: Verify installed entrypoint
        run: |
          kubo-core self-check > self-check.json
          python -c 'import json; report=json.load(open("self-check.json", encoding="utf-8")); assert report["status"] == "PASS"; assert report["version"] == "0.3.1"'
