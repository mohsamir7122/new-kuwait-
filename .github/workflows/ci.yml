name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install --disable-pip-version-check --no-input ".[test]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test clean core
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Self-check
        env:
          PYTHONPATH: src
        run: python -m kubo self-check
      - name: Example end-to-end analysis
        run: |
          example_root=$(mktemp -d)
          kubo-core analyze-local \
            --bundle examples/local_bundle \
            --output "$example_root/result" \
            > "$example_root/stdout.json"
          python -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["status"] == "PASS_RESEARCH_SUMMARY"; assert report["claim_boundaries"]["recommendation"] is False' "$example_root/stdout.json"
